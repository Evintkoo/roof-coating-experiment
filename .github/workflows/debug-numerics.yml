name: debug-numerics
on:
  push:
    branches: [debug/linux-numerics]
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: astral-sh/setup-uv@v5
      - run: bun install --frozen-lockfile
      - run: uname -m && bun --version && ldd --version | head -1
      - run: bun scripts/debug-numerics.ts .dbg/linux
      - run: bun scripts/debug-refine.ts .dbg/linux/refine
      - name: oracle regenerate (writes fixtures into the work tree)
        run: |
          uv run --project oracle oracle/generate.py || true
          mkdir -p .dbg/linux/oracle
          cp -r tests/fixtures/oracle/. .dbg/linux/oracle/
          git diff --stat | tail -20
      - uses: actions/upload-artifact@v4
        with:
          name: linux-dump
          path: .dbg/linux
  files:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: astral-sh/setup-uv@v5
      - run: bun install --frozen-lockfile
      - run: bun test --timeout 300000 tests/core/models/thermal.test.ts tests/oracle.fixtures.test.ts
      - run: bun test --timeout 300000 tests/node/refine.test.ts
      - run: bun test --timeout 300000 tests/refine.baseline.test.ts
        if: always()
  tier:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: astral-sh/setup-uv@v5
      - run: bun install --frozen-lockfile
      - run: google-chrome --version
      - run: bun run test:ci
